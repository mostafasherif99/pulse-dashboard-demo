<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=2e8c3a8e-5167-4b7d-8c6a-77fff4cdc6eb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Admin Dashboard Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e8eaf2;--pri:#6366f1;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--side:#111827}
.dark{--bg:#0b1020;--card:#141a2e;--ink:#e8ebf5;--mut:#8b93ab;--line:#232b45;--side:#0a0e1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Cairo','Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;transition:.2s}
[dir=rtl] body{font-family:'Cairo','Inter',sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit}
aside{width:240px;background:var(--side);color:#cbd2e6;padding:24px 16px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:22px;color:#fff;padding:0 10px 20px;display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);display:block}
aside a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:#a5aec6}
aside a.on,aside a:hover{background:#ffffff14;color:#fff}
aside a span{width:20px;text-align:center}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;background:#ffffff0d;border-radius:14px;font-size:13px}
.me b{display:block;color:#fff}.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;color:#fff;font-weight:800}
main{flex:1;min-width:0;padding:24px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.5px}.top p{color:var(--mut);font-size:14px}
.tb{display:flex;gap:10px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:13px}
.menu{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.kpi small{color:var(--mut);font-weight:600;font-size:13px}
.kpi b{display:block;font-size:28px;font-weight:800;margin:8px 0 4px;letter-spacing:-1px}
.up{color:var(--ok);font-weight:700;font-size:13px}.dn{color:var(--bad);font-weight:700;font-size:13px}
.kpi svg{width:100%;height:36px;margin-top:6px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}.card .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}.seg button{background:none;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#line{width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.bar{font-size:13px;font-weight:600}.bar div{display:flex;justify-content:space-between;margin-bottom:5px}.bar i{display:block;height:8px;border-radius:8px;background:var(--bg);overflow:hidden}.bar i s{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#6366f1,#a855f7)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:start;color:var(--mut);font-weight:600;font-size:12px;padding:10px 12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}
tbody tr:hover{background:var(--bg)}
.cu{display:flex;gap:10px;align-items:center;font-weight:600}.cu span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.st{padding:4px 12px;border-radius:50px;font-size:12px;font-weight:700}
.st.done{background:#10b9811f;color:var(--ok)}.st.pend{background:#f59e0b1f;color:var(--warn)}.st.canc{background:#ef44441f;color:var(--bad)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--mut)}
.pg button{background:var(--bg);padding:7px 14px;border-radius:10px;font-weight:600}.pg button:disabled{opacity:.4}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
@media(max-width:820px){table{min-width:0}th:nth-child(3),td:nth-child(3){display:none}th,td{padding:10px 6px}aside{position:fixed;z-index:20;inset-block:0;inset-inline-start:0;transform:translateX(-100%);transition:.25s}[dir=rtl] aside{transform:translateX(100%)}aside.open{transform:none!important}
 .menu{display:block}main{padding:16px}.kpis{gap:10px}.kpi b{font-size:22px}.card{padding:16px;border-radius:16px}}
</style>
</head>
<body>
<aside id="sb"><div class="logo"><i></i>Pulse</div><div id="nav"></div>
 <div class="me"><div class="av">M</div><div><b>Mostafa</b><span id="role"></span></div></div></aside>
<main>
 <div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="menu" id="mb">☰</button><div><h1 id="t1"></h1><p id="t2"></p></div></div>
  <div class="tb"><button class="pill" id="lg"></button><button class="pill" id="dm">Dark</button></div></div>
 <div class="kpis" id="kpis"></div>
 <div class="row">
  <div class="card"><div class="ch"><div><h3 id="c1"></h3><p class="sub" id="c1s"></p></div><div class="seg" id="seg"></div></div><svg id="line" viewBox="0 0 700 260"></svg></div>
  <div class="card"><h3 id="c2"></h3><p class="sub" id="c2s"></p><div class="bars" id="bars"></div></div>
 </div>
 <div class="card"><div class="ch"><div><h3 id="c3"></h3><p class="sub" id="c3s"></p></div></div>
  <div class="tools"><input id="q"><select id="f"></select></div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div class="pg"><span id="pi"></span><div><button id="pp"></button> <button id="pn"></button></div></div></div>
</main>
<script>
const T={en:{nav:["Overview","Orders","Customers","Products","Reports","Settings"],role:"Admin",t1:"Overview",t2:"Welcome back, here is what is happening today.",lg:"العربية",
k:["Revenue","Orders","Customers","Conversion"],c1:"Revenue",c1s:"Sales over time (EGP thousands)",seg:["7 days","30 days"],c2:"Top categories",c2s:"Share of sales this month",
c3:"Recent orders",c3s:"Manage and filter customer orders",q:"Search order or customer...",st:{all:"All statuses",done:"Completed",pend:"Pending",canc:"Cancelled"},
th:["Order","Customer","Date","Amount","Status"],cats:["Electronics","Fashion","Home","Beauty","Sports"],prev:"Previous",next:"Next",of:"Showing {a}-{b} of {n}",cur:"EGP"},
ar:{nav:["نظرة عامة","الطلبات","العملاء","المنتجات","التقارير","الإعدادات"],role:"مدير",t1:"نظرة عامة",t2:"أهلًا بعودتك، ده ملخص اليوم.",lg:"English",
k:["الإيرادات","الطلبات","العملاء","نسبة التحويل"],c1:"الإيرادات",c1s:"المبيعات عبر الوقت (بالألف جنيه)",seg:["٧ أيام","٣٠ يوم"],c2:"أفضل الأقسام",c2s:"نسبة المبيعات هذا الشهر",
c3:"أحدث الطلبات",c3s:"إدارة وفلترة طلبات العملاء",q:"ابحث برقم الطلب أو العميل...",st:{all:"كل الحالات",done:"مكتمل",pend:"قيد التنفيذ",canc:"ملغي"},
th:["الطلب","العميل","التاريخ","المبلغ","الحالة"],cats:["إلكترونيات","أزياء","المنزل","جمال","رياضة"],prev:"السابق",next:"التالي",of:"عرض {a}-{b} من {n}",cur:"ج.م"}};
const names={en:["Ahmed Hassan","Mona Adel","Karim Hany","Sara Mostafa","Omar Khaled","Nour Samir","Youssef Ali","Heba Tarek","Mahmoud Fawzy","Dina Sherif","Ali Ibrahim","Laila Ashraf"],
ar:["أحمد حسن","منى عادل","كريم هاني","سارة مصطفى","عمر خالد","نور سمير","يوسف علي","هبة طارق","محمود فوزي","دينا شريف","علي إبراهيم","ليلى أشرف"]};
const cols=["#6366f1","#ec4899","#f59e0b","#10b981","#0ea5e9","#a855f7"];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const orders=Array.from({length:36},(_,i)=>({id:2400-i,c:Math.floor(rnd()*12),d:new Date(2026,10,25-Math.floor(i/2)),a:Math.round(300+rnd()*7000),s:["done","done","done","pend","canc"][Math.floor(rnd()*5)]}));
const series={0:[42,55,48,70,64,88,96],1:[30,34,41,38,52,49,60,58,66,63,72,70,81,77,85,92,88,95,90,104,99,110,108,118,115,124,121,132,128,140]};
let lang=localStorage.dl||"en",rng=0,page=0,PS=8;const $=s=>document.querySelector(s);const fmt=n=>n.toLocaleString(lang=="ar"?"ar-EG":"en-US");
function spark(v,col){const w=100,h=36,m=Math.max(...v),n=Math.min(...v);const p=v.map((x,i)=>`${i*w/(v.length-1)},${h-4-(x-n)/(m-n||1)*(h-8)}`).join(" ");return `<svg viewBox="0 0 100 36" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function chart(){const v=series[rng],W=700,H=260,pad=30,m=Math.max(...v)*1.1;const x=i=>pad+i*(W-pad*2)/(v.length-1),y=a=>H-pad-a/m*(H-pad*2);
 const pts=v.map((a,i)=>`${x(i)},${y(a)}`);let g="";for(let i=0;i<=4;i++){const yy=pad+i*(H-pad*2)/4;g+=`<line x1="${pad}" x2="${W-pad}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="4" y="${yy+4}" font-size="10" fill="var(--mut)">${Math.round(m*(1-i/4))}</text>`}
 $("#line").innerHTML=`<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>${g}<polygon points="${x(0)},${H-pad} ${pts.join(" ")} ${x(v.length-1)},${H-pad}" fill="url(#gr)"/><polyline points="${pts.join(" ")}" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${v.map((a,i)=>i%(v.length>10?5:1)==0||i==v.length-1?`<circle cx="${x(i)}" cy="${y(a)}" r="4" fill="#fff" stroke="#6366f1" stroke-width="2.5"/>`:"").join("")}`}
function table(){const t=T[lang],q=$("#q").value.trim().toLowerCase(),f=$("#f").value;
 const a=orders.filter(o=>(f=="all"||o.s==f)&&(("#"+o.id+names[lang][o.c]).toLowerCase().includes(q)));
 if(page*PS>=a.length)page=0;const sl=a.slice(page*PS,page*PS+PS);
 $("#tb").innerHTML=sl.map(o=>`<tr><td><b>#${o.id}</b></td><td><div class="cu"><span style="background:${cols[o.c%6]}">${names[lang][o.c][0]}</span>${names[lang][o.c]}</div></td><td>${o.d.toLocaleDateString(lang=="ar"?"ar-EG":"en-GB",{day:"numeric",month:"short"})}</td><td><b>${fmt(o.a)}</b> ${t.cur}</td><td><span class="st ${o.s}">${t.st[o.s]}</span></td></tr>`).join("");
 $("#pi").textContent=t.of.replace("{a}",a.length?page*PS+1:0).replace("{b}",Math.min(a.length,page*PS+PS)).replace("{n}",a.length);
 $("#pp").disabled=page==0;$("#pn").disabled=(page+1)*PS>=a.length}
function ui(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 $("#nav").innerHTML=t.nav.map((n,i)=>`<a class="${i?"":"on"}"><span>${["▦","▤","☺","◧","▥","⚙"][i]}</span>${n}</a>`).join("");$("#role").textContent=t.role;$("#t1").textContent=t.t1;$("#t2").textContent=t.t2;$("#lg").textContent=t.lg;
 const kv=[["182,430 "+t.cur,"+12.5%",1,[40,52,48,66,60,78,90]],["1,284","+8.2%",1,[30,28,35,40,38,50,55]],["9,742","+3.1%",1,[50,52,51,55,54,58,60]],["3.8%","-0.4%",0,[60,58,62,57,55,56,52]]];
 $("#kpis").innerHTML=kv.map((k,i)=>`<div class="card kpi"><small>${t.k[i]}</small><b>${lang=="ar"?k[0].replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):k[0]}</b><span class="${k[2]?"up":"dn"}">${k[2]?"▲":"▼"} ${k[1]}</span>${spark(k[3],k[2]?"#10b981":"#ef4444")}</div>`).join("");
 $("#c1").textContent=t.c1;$("#c1s").textContent=t.c1s;$("#c2").textContent=t.c2;$("#c2s").textContent=t.c2s;$("#c3").textContent=t.c3;$("#c3s").textContent=t.c3s;
 $("#seg").innerHTML=t.seg.map((s,i)=>`<button class="${i==rng?"on":""}" data-r="${i}">${s}</button>`).join("");
 const sh=[38,27,16,11,8];$("#bars").innerHTML=t.cats.map((c,i)=>`<div class="bar"><div><span>${c}</span><span>${fmt(sh[i])}%</span></div><i><s style="width:${sh[i]*2.4}%"></s></i></div>`).join("");
 $("#q").placeholder=t.q;const cf=$("#f").value||"all";$("#f").innerHTML=Object.entries(t.st).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");$("#f").value=cf;
 $("#th").innerHTML="<tr>"+t.th.map(h=>`<th>${h}</th>`).join("")+"</tr>";$("#pp").textContent=t.prev;$("#pn").textContent=t.next;chart();table()}
document.addEventListener("click",e=>{const r=e.target.closest("[data-r]");if(r){rng=+r.dataset.r;ui()}});
$("#q").oninput=()=>{page=0;table()};$("#f").onchange=()=>{page=0;table()};$("#pp").onclick=()=>{page--;table()};$("#pn").onclick=()=>{page++;table()};
$("#lg").onclick=()=>{lang=lang=="en"?"ar":"en";localStorage.dl=lang;ui()};
$("#dm").onclick=()=>{$("#dm").textContent=document.body.classList.contains("dark")?"Dark":"Light";document.body.classList.toggle("dark");localStorage.dd=document.body.classList.contains("dark")?1:""};
$("#mb").onclick=()=>$("#sb").classList.toggle("open");$("#nav").onclick=()=>$("#sb").classList.remove("open");
if(localStorage.dd)document.body.classList.add("dark");ui();
</script>
</body></html>
